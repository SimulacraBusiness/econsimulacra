[tool.poetry]
name = "econsimulacra"
version = "0.1.0"
description = ""
authors = ["ryuji-hashimoto0110"]
readme = "README.md"
packages = [{ include = "econsimulacra", from = "src" }]
include = ["src/econsimulacra/py.typed"]

# ---------------------------------------------------------
# Core dependencies (always installed)
# ---------------------------------------------------------
[tool.poetry.dependencies]
python = ">=3.10,<3.13"
typing-extensions = "^4.15.0"
torch = "2.2.1"
numpy = "^1.26.1"
pandas = "^2.3.3"
matplotlib = "^3.10.8"
openai = "^2.21.0"
outlines = "0.1.11"
rich = "^14.2.0"
accelerate = "^1.12.0"
datasets = "^4.5.0"
transformers = "^4.49.0"
statsmodels = "^0.14.6"
sentencepiece = "^0.2.1"
protobuf = "^7.34.0"
types-tqdm = "^4.67.3.20260205"

# ---------------------------------------------------------
# Development tools
# Install with:
#   poetry install --with dev
# Used in CI (ruff, mypy, pytest)
# ---------------------------------------------------------
[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pytest-cov = "^7.0.0"
mypy = "^1.19.1"
ruff = "^0.14.13"

# ---------------------------------------------------------
# Animation dependencies (manim requires cairo/pango system libs)
# Install only when working on animations:
#   poetry install --with dev,animations
#
# CI does NOT install this group to avoid cairo build issues.
# ---------------------------------------------------------
[tool.poetry.group.animations]
optional = true

[tool.poetry.group.animations.dependencies]
manim = "^0.18.1"

# ---------------------------------------------------------
# Mypy configuration
# Animations layer is excluded because manim lacks full type hints
# ---------------------------------------------------------
[tool.mypy]
python_version = "3.11"
exclude = ["src/econsimulacra/animations/"]

[[tool.mypy.overrides]]
module = ["manim", "manim.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["econsimulacra.animations", "econsimulacra.animations.*"]
ignore_missing_imports = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

