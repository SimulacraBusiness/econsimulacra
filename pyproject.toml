[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "econsimulacra"
version = "0.9.0"
description = "EconSimulacra: A Digital Twin Platform of Socio-Economic Systems Powered by LLM Agents"
authors = ["Ryuji Hashimoto <r_hashimoto@simulacra.co.jp>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "econsimulacra", from = "src" }]
include = ["src/econsimulacra/py.typed"]
repository = "https://github.com/SimulacraBusiness/econsimulacra"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]

# ---------------------------------------------------------
# Core dependencies (always installed)
# ---------------------------------------------------------
[tool.poetry.dependencies]
python = ">=3.10,<3.13"
typing-extensions = "^4.15.0"
torch = "2.10.0"
numpy = "^1.26.1"
openai = "^2.21.0"
outlines = "0.1.11"
rich = "^14.2.0"
accelerate = "^1.12.0"
datasets = "^4.5.0"
transformers = "^4.49.0"
statsmodels = "^0.14.6"
sentencepiece = "^0.2.1"
protobuf = "^7.34.0"
types-tqdm = "^4.67.3.20260205"

# ---------------------------------------------------------
# Development tools
# Install with:
#   poetry install --with dev
# Used in CI (ruff, mypy, pytest)
# ---------------------------------------------------------
[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pytest-cov = "^7.0.0"
mypy = "^1.19.1"
ruff = "^0.14.13"

# ---------------------------------------------------------
# Sphinx documentation dependencies
# Install with:
#   poetry install --with docs
# Used by the docs GitHub Actions workflow
# ---------------------------------------------------------
[tool.poetry.group.docs.dependencies]
sphinx = "^8.2.3"
sphinx-rtd-theme = "^3.0.2"
myst-parser = "^4.0.1"
sphinx-autobuild = "^2024.10.3"

# ---------------------------------------------------------
# Mypy configuration
# Animations layer is excluded because manim lacks full type hints
# ---------------------------------------------------------
[tool.mypy]
python_version = "3.11"
exclude = ["src/econsimulacra/animations/"]

[[tool.mypy.overrides]]
module = ["manim", "manim.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["econsimulacra.animations", "econsimulacra.animations.*"]
ignore_missing_imports = true

# ---------------------------------------------------------
# Ruff configuration
# ---------------------------------------------------------
[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
combine-as-imports = true
