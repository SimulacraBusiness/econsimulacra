[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "econsimulacra"
version = "0.1.0"
description = "EconSimulacra: A Digital Twin Platform of Consumer Economy Powerd by LLM Agents"
authors = ["Ryuji Hashimoto <r_hashimoto@simulacra.co.jp>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "econsimulacra", from = "src" }]
include = ["src/econsimulacra/py.typed"]
repository = "https://github.com/SimulacraBusiness/econsimulacra"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]

# ---------------------------------------------------------
# Core dependencies (always installed)
# ---------------------------------------------------------
[tool.poetry.dependencies]
python = ">=3.10,<3.13"
typing-extensions = "^4.15.0"
numpy = "^1.26.1"
rich = "^14.2.0"
types-tqdm = "^4.67.3.20260205"
openai="^2.21.0"

# Optional dependencies for extras
outlines = { version = "0.1.11", optional = true }

torch = { version = "2.2.1", optional = true }
accelerate = { version = "^1.12.0", optional = true }
datasets = { version = "^4.5.0", optional = true }
transformers = { version = "^4.49.0", optional = true }
sentencepiece = { version = "^0.2.1", optional = true }
protobuf = { version = "^7.34.0", optional = true }

matplotlib = { version = "^3.10.8", optional = true }
statsmodels = { version = "^0.14.6", optional = true }

manim = { version = "^0.18.1", optional = true }

[tool.poetry.extras]
ml = ["torch", "accelerate", "datasets", "transformers", "outlines", "sentencepiece", "protobuf"]
viz = ["matplotlib", "statsmodels"]
animations = ["manim"]
full = [
  "outlines",
  "torch",
  "accelerate",
  "datasets",
  "transformers",
  "sentencepiece",
  "protobuf",
  "matplotlib",
  "statsmodels",
  "manim",
]

# ---------------------------------------------------------
# Development tools
# Install with:
#   poetry install --with dev
# Used in CI (ruff, mypy, pytest)
# ---------------------------------------------------------
[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pytest-cov = "^7.0.0"
mypy = "^1.19.1"
ruff = "^0.14.13"

# ---------------------------------------------------------
# Mypy configuration
# Animations layer is excluded because manim lacks full type hints
# ---------------------------------------------------------
[tool.mypy]
python_version = "3.11"
exclude = ["src/econsimulacra/animations/"]

[[tool.mypy.overrides]]
module = ["manim", "manim.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["econsimulacra.animations", "econsimulacra.animations.*"]
ignore_missing_imports = true